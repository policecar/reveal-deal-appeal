model:
  name: "answerdotai/ModernBERT-base"
  # Memory knobs, tuned for 24GB MPS: raise max_length/batch_size on bigger
  # hardware (ModernBERT supports up to 8192 tokens). gradient_checkpointing
  # trades ~30% compute for ~10x less activation memory; disable on GPUs with
  # plenty of VRAM for faster steps.
  max_length: 1024
  batch_size: 4  # contrastive pairs per step (2 sequences each)
  gradient_checkpointing: true
  # Head loss for imbalance: null = class-weighted cross-entropy,
  # a float (e.g. 2.0) = focal loss with that gamma (also class-weighted)
  focal_gamma: null
  freeze_embeddings: true
  bottleneck_dim: 128

training:
  learning_rate: 2e-5
  num_epochs: 10
  train_batch_size: 4
  eval_batch_size: 8
  weight_decay: 0.01
  warmup_steps: 500

data:
  file_path: "data/transcripts.xlsx"
  excel_sheet_name: "discovery calls"
  excel_text_col: "Transcription"
  excel_label_col: "Win/ No Win"
  train_split: 0.8
  seed: 1537
  shuffle: true
  embeddings_path: "data/embeddings"
  finetune_dataset: "craig/prosus-converted"  # Sales calls dataset
  finetune_subset: "train"
